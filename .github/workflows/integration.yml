name: Integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MB_EMAIL: integration@example.com
      MB_PASSWORD: IntegrationOnly12345!
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up -d --build
      - name: Wait for Flink job
        run: python Scripts/check_stream.py --running
      - name: Send initial data
        run: docker compose --profile send run --rm --no-deps -e SEND_DELAY=0 producer
      - name: Validate initial results
        run: docker compose --profile send run --rm --no-deps producer python Scripts/verify.py
      - name: Wait for all Kafka records
        run: python Scripts/check_stream.py --drained --expected-input=10000
      - name: Send the same data again
        run: docker compose --profile send run --rm --no-deps -e SEND_DELAY=0 producer
      - name: Wait for duplicate delivery
        run: python Scripts/check_stream.py --drained --expected-input=20000
      - name: Validate idempotency
        run: docker compose --profile send run --rm --no-deps producer python Scripts/verify.py
      - name: Restart Flink processes
        run: docker compose restart jobmanager taskmanager
      - name: Wait for restarted job and replay
        run: |
          python Scripts/check_stream.py --running
          python Scripts/check_stream.py --drained --expected-input=20000
      - name: Validate results after restart
        run: docker compose --profile send run --rm --no-deps producer python Scripts/verify.py
      - name: Save service logs
        if: always()
        run: |
          docker compose ps -a > integration.log
          docker compose logs --no-color >> integration.log 2>&1
          cat integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: integration.log
      - name: Stop services
        if: always()
        run: docker compose down -v
